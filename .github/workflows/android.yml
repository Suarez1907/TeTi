name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload APK to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Build with Gradle
      run: gradle assembleRelease --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload APK to Release
      if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''))
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_TAG: ${{ github.event.inputs.release_tag }}
        REF_NAME: ${{ github.ref_name }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
      run: |
        TAG="${EVENT_TAG:-${INPUT_TAG:-$REF_NAME}}"
        if [ -n "$TAG" ] && [ "$TAG" != "main" ]; then
          echo "Uploading APK to release $TAG..."
          cp app/build/outputs/apk/release/app-release-unsigned.apk "TeTi-${TAG}.apk"
          gh release upload "$TAG" "TeTi-${TAG}.apk" --clobber
        fi

name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload APK to (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Decode release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.TETI_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/teti-release.jks"
          echo "TETI_KEYSTORE_FILE=$RUNNER_TEMP/teti-release.jks" >> "$GITHUB_ENV"
          echo "Signing with the release keystore from secrets."
        else
          echo "::warning::TETI_KEYSTORE_BASE64 secret not set; signing with a debug key."
        fi

    - name: Build with Gradle
      env:
        TETI_KEYSTORE_PASSWORD: ${{ secrets.TETI_KEYSTORE_PASSWORD }}
        TETI_KEY_ALIAS: ${{ secrets.TETI_KEY_ALIAS }}
        TETI_KEY_PASSWORD: ${{ secrets.TETI_KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload APK to Release
      if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''))
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_TAG: ${{ github.event.inputs.release_tag }}
        REF_NAME: ${{ github.ref_name }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
      run: |
        TAG="${EVENT_TAG:-${INPUT_TAG:-$REF_NAME}}"
        if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
          echo "No release tag; skipping upload."
          exit 0
        fi
        APK="TeTi-${TAG}.apk"
        cp app/build/outputs/apk/release/app-release.apk "$APK"
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          echo "Creating release $TAG at $GITHUB_SHA..."
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        fi
        echo "Uploading $APK to release $TAG..."
        gh release upload "$TAG" "$APK" --clobber
